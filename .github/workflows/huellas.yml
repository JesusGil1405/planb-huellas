name: Huellas
on:
  push:
    branches: [main]
    paths: ['conector/**', 'scripts/**', 'huellas-config.json']
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: huellas
  cancel-in-progress: false
jobs:
  huellas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Calcular huellas
        env:
          ENVATO_TOKEN: ${{ secrets.ENVATO_TOKEN }}
        run: php -d memory_limit=1G scripts/huellas.php
      - name: Publicar huellas.json
        run: |
          if git diff --quiet -- huellas.json && git ls-files --error-unmatch huellas.json >/dev/null 2>&1; then echo "Sin cambios"; exit 0; fi
          git config user.name "verificador-planb"
          git config user.email "verificador@users.noreply.github.com"
          git add huellas.json
          git commit -m "Huellas actualizadas"
          git push
